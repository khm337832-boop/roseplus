# fly.io မှာ run ချင်ရင်:  fly launch --no-deploy  →  fly secrets set BOT_TOKEN=...  →  fly deploy
app = "goii-auto-bot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "roseplus_data"
  destination = "/app/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
